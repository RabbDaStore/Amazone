<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 1100px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: #fff;
            border-radius: 6px;
            padding: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 4px;
        }

        .card a {
            display: block;
            margin-top: 10px;
            text-decoration: none;
            color: #007185;
            font-weight: bold;
        }

        .card a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<h2 style="text-align:center;">Product List</h2>

<div class="container">

    <div class="card">
        <a href="https://www.amazon.in/dp/PRODUCTID1" target="_blank">
            <img src="https://m.media-amazon.com/images/I/IMAGE1.jpg" alt="Product 1">
            Women's Kurta Set
        </a>
    </div>

    <div class="card">
        <a href="https://www.amazon.in/dp/PRODUCTID2" target="_blank">
            <img src="https://m.media-amazon.com/images/I/IMAGE2.jpg" alt="Product 2">
            Cotton Kurta
        </a>
    </div>

    <div class="card">
        <a href="https://www.amazon.in/dp/PRODUCTID3" target="_blank">
            <img src="https://m.media-amazon.com/images/I/IMAGE3.jpg" alt="Product 3">
            Ethnic Dress
        </a>
    </div>

</div>

</body>
</html>
