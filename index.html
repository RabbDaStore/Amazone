<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 1100px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: #fff;
            border-radius: 6px;
            padding: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 4px;
        }

        .card a {
            display: block;
            margin-top: 10px;
            text-decoration: none;
            color: #007185;
            font-weight: bold;
        }

        .card a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<h2 style="text-align:center;">Product List</h2>

<div class="container">

    <div class="card">
        <a href="https://amzn.to/4rj4emB" target="_blank">
            <img src="https://m.media-amazon.com/images/G/31/img2020/fashion/WomensApparel2024/p0SBC/Tops__Tees._CB558287246_.png" alt="Tees & Tops">
            Tops & Tees
        </a>
    </div>

    <div class="card">
        <a href="https://amzn.to/3M5gbgv" target="_blank">
            <img src="https://m.media-amazon.com/images/G/31/img2020/fashion/WomensApparel2024/p0SBC/Dresses__Jumpsuits._CB558287246_.png" alt="Product 2">
            Cotton Kurta
        </a>
    </div>

    <div class="card">
        <a href="https://amzn.to/3NDjBHQ" target="_blank">
            <img src="https://m.media-amazon.com/images/G/31/img2020/fashion/WomensApparel2024/p0SBC/Jeans__Jeggings._CB558287246_.png" alt="Product 3">
            Ethnic Dress
        </a>
    </div>

</div>

</body>
</html>
